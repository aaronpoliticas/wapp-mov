        // --- OPERATIONAL FORECAST SYSTEM ---

        // Helper: Detectar tipo de demanda
        const detectDemandType = (series) => {
            if (!series || series.length === 0) return 'UNKNOWN';
            const nonZero = series.filter(v => v > 0).length;
            const total = series.length;
            if (total < 6) return 'SPARSE'; // Insufficient history (< 6 months)
            const zeroRatio = (total - nonZero) / total;
            if (zeroRatio > 0.35) return 'INTERMITTENT'; // Frequent zeros (>35%)
            return 'STABLE';
        };

        // Modelo 1: Croston/TSB (Simplificado para JS) para series intermitentes
        const calculateCroston = (data, forecastLength) => {
            const nonZeroValues = data.filter(v => v > 0);
            if (nonZeroValues.length === 0) return Array(forecastLength).fill(0);
            
            // Probabilidad de compra (Active months / Total months)
            const probPurchase = nonZeroValues.length / data.length;
            // Volumen esperado (Promedio de meses activos)
            const expectedVol = nonZeroValues.reduce((a,b)=>a+b,0) / nonZeroValues.length;
            
            const forecastVal = probPurchase * expectedVol;
            return Array(forecastLength).fill(forecastVal);
        };

        // Modelo 2: Weighted Growth para series nuevas/escasas
        const calculateWeightedGrowth = (data, forecastLength) => {
            if (data.length === 0) return Array(forecastLength).fill(0);
            const lastVal = data[data.length-1];
            // Asumir tendencia global conservadora del 3% si no hay datos suficientes
            const globalTrend = 0.03 / 12; 
            return Array.from({length: forecastLength}, (_, i) => lastVal * (1 + globalTrend * (i+1)));
        };

        // Modelo 3: Holt-Winters Operativo (Existente + Mejoras)
        const calculateHoltWinters = (data, seasonLength = 12, alpha = 0.25, beta = 0.05, gamma = 0.1, forecastLength = 12) => {
            if (!data || data.length === 0) return Array(forecastLength).fill(0);
            
            // Si hay pocos datos, fallback a proyección lineal simple
            if (data.length < seasonLength) {
                const growth = data.length > 3 ? (data[data.length-1] - data[0]) / data.length : 0;
                const lastVal = data[data.length - 1] || 0;
                return Array.from({length: forecastLength}, (_, i) => Math.max(0, lastVal * (1 + growth * (i+1))));
            }

            // Inicialización de componentes
            let seasonals = Array(seasonLength).fill(0);
            const dataAvg = data.reduce((a,b)=>a+b,0)/data.length;
            
            // Calcular estacionalidad inicial
            if (data.length >= seasonLength * 2) {
                for (let i = 0; i < seasonLength; i++) {
                    let sumDiff = 0;
                    let count = 0;
                    for (let j = i; j < data.length; j += seasonLength) {
                        sumDiff += (data[j] - dataAvg);
                        count++;
                    }
                    seasonals[i] = count > 0 ? sumDiff / count : 0;
                }
            }

            // Suavizado Exponencial
            let level = data[0]; 
            let trend = (data[seasonLength] - data[0]) / seasonLength; // Tendencia inicial más robusta
            
            // Ejecutar sobre historial para "aprender" nivel y tendencia actuales
            for (let i = 0; i < data.length; i++) {
                const val = data[i];
                const lastLevel = level;
                const seasonIdx = i % seasonLength;
                
                // Holt-Winters level update
                level = alpha * (val - seasonals[seasonIdx]) + (1 - alpha) * (lastLevel + trend);
                // Trend update
                trend = beta * (level - lastLevel) + (1 - beta) * trend;
                // Season update (only if enough data, dampened)
                seasonals[seasonIdx] = gamma * (val - level) + (1 - gamma) * seasonals[seasonIdx];
            }

            // Generar Forecast Futuro
            const forecast = [];
            for (let i = 1; i <= forecastLength; i++) {
                const seasonIdx = (data.length + i - 1) % seasonLength;
                // Damping factor: reduce la agresividad de la tendencia a largo plazo (realismo operativo)
                const damping = Math.pow(0.98, i); 
                const val = level + (trend * i * damping) + seasonals[seasonIdx];
                forecast.push(val > 0 ? val : 0);
            }
            return forecast;
        };

        // MASTER ENGINE: Selector Dinámico de Modelos
        const generateOperationalForecast = (series, forecastLength = 12) => {
            const type = detectDemandType(series);
            
            if (type === 'INTERMITTENT') {
                return calculateCroston(series, forecastLength);
            } else if (type === 'SPARSE') {
                return calculateWeightedGrowth(series, forecastLength);
            } else {
                // STABLE -> Holt-Winters
                // Detectar varianza para ajustar gamma (si es muy plano, gamma = 0)
                const mean = series.reduce((a,b)=>a+b,0)/series.length;
                const variance = series.reduce((a,b)=>a+Math.pow(b-mean,2),0)/series.length;
                const lowSeasonality = (Math.sqrt(variance)/mean) < 0.1;
                
                return calculateHoltWinters(series, 12, 0.3, 0.1, lowSeasonality ? 0 : 0.15, forecastLength);
            }
        };

        // ANNUAL FORECAST LOGIC (TABLAS): Structural Growth
        const calculateStructuralForecast2026 = (rev2024, rev2025) => {
            // No usar suma de HW mensual para el total anual, usar tendencia estructural
            if (rev2024 === 0) return rev2025 * 1.05; // Fallback para nuevos clientes (5% conservador)
            
            const rawGrowth = (rev2025 - rev2024) / rev2024;
            
            // Reglas de Realismo Operativo:
            // 1. Cap growth excesivo (>40% se considera anomalía o apertura, se suaviza al 25% para planning)
            // 2. Floor caídas excesivas (<-20% asume recuperación parcial o estabilización)
            
            let planningGrowth = rawGrowth;
            if (rawGrowth > 0.40) planningGrowth = 0.25; 
            else if (rawGrowth > 0.20) planningGrowth = 0.15; // Growth tier 2
            else if (rawGrowth < -0.20) planningGrowth = -0.10; // Soft landing
            
            return rev2025 * (1 + planningGrowth);
        };

        // --- HELPERS SEGUROS ---

        // --- COMPONENTES UI ---
        const KPICard = ({ title, value, subValue, icon: Icon, trend, trendValue, isForecast, t }) => (

                            <p className="text-2xl font-bold text-white">${new Intl.NumberFormat('es-MX', {maximumFractionDigits:0}).format(entity.forecast2026)}</p>

                        {insights.length > 0 ? insights.map((insight, i) => {

        const App = () => {
            const [activeTab, setActiveTab] = useState('dashboard');
            const [rawData, setRawData] = useState([]);
            const [selectedYear, setSelectedYear] = useState('All'); 
            const [loading, setLoading] = useState(true);
            const [errorMsg, setErrorMsg] = useState(null);
            const [isPdfReady, setIsPdfReady] = useState(false);
            const [selectedForecastQuarter, setSelectedForecastQuarter] = useState('Q1');
            const [selectedEntity, setSelectedEntity] = useState(null); 
            const [periodStart, setPeriodStart] = useState('');
            const [periodEnd, setPeriodEnd] = useState('');
            const [periodBranch, setPeriodBranch] = useState('All');
            const [lang, setLang] = useState('MX');
            const [isConnected, setIsConnected] = useState(true); // Estado de conexión

            // Acceso rápido a textos traducidos
            const t = TRANSLATIONS[lang];

            // --- CARGA DE DATOS ---
            useEffect(() => {
                const loadData = async () => {
                    setLoading(true);
                    setErrorMsg(null);
                    setIsConnected(true); // Asumimos conexión al inicio
                    try {
                        const response = await fetch(DATA_URL);
                        if (!response.ok) throw new Error("Error de red");
                        const csvText = await response.text();
                        
                        const rows = csvText.split(/\r?\n/);
                        if (rows.length < 2) { 
                            setErrorMsg("Empty file"); 
                            setLoading(false); 
                            return; 
                        }
                        
                        const headers = rows[0].split(',').map(h => h.trim());
                        const colFecha = headers.findIndex(h => h.toLowerCase().includes('fecha'));
                        const colTotal = headers.findIndex(h => h.toLowerCase().includes('total'));
                        let colKilos = headers.findIndex(h => h.toLowerCase() === 'kilos');
                        if (colKilos === -1) colKilos = headers.findIndex(h => h.toLowerCase().includes('kilos') || h.toLowerCase().includes('peso'));
                        const colPrecio = headers.findIndex(h => h.toLowerCase().includes('precio por kg'));
                        const colSucursal = headers.findIndex(h => h.toLowerCase().includes('sucursal'));
                        const colRazon = headers.findIndex(h => h.toLowerCase().includes('razon social'));
                        const colVariedad = headers.findIndex(h => h.toLowerCase().includes('variedad'));
                        const colTipo = headers.findIndex(h => h.toLowerCase().includes('tipo de consumo'));

                        const parsed = [];
                        const splitCSV = (str) => {
                            const arr = [];
                            let quote = false;
                            let col = '';
                            for (let i = 0; i < str.length; i++) {
                                let c = str[i];
                                if (c === '"') { quote = !quote; continue; }
                                if (c === ',' && !quote) { arr.push(col); col = ''; continue; }
                                col += c;
                            }
                            arr.push(col);
                            return arr;
                        };

                        for (let i = 1; i < rows.length; i++) {
                            const line = rows[i].trim();
                            if (!line) continue;
                            const row = splitCSV(line);
                            let dStr = row[colFecha];
                            let date;
                            if (dStr && dStr.includes('/')) {
                                const parts = dStr.split('/');
                                date = new Date(`${parts[2]}-${parts[1]}-${parts[0]}`); 
                            } else if (dStr) {
                                date = new Date(dStr);
                            }
                            if (!date || isNaN(date.getTime())) continue;

                            const cleanNum = (val) => {
                                if (!val) return 0;
                                return parseFloat(val.replace(/,/g, '')) || 0;
                            };

                            parsed.push({
                                id: i, Fecha: date, Year: date.getFullYear(), Month: date.getMonth() + 1, Day: date.getDate(),
                                Sucursal: row[colSucursal]?.trim() || 'Desconocida',
                                RazonSocial: row[colRazon]?.trim() || 'General',
                                Variedad: row[colVariedad]?.trim() || 'General',
                                TipoConsumo: row[colTipo]?.trim() || 'General',
                                Kilos: cleanNum(row[colKilos]),
                                Total_compra: cleanNum(row[colTotal]),
                                Precio_por_Kg: cleanNum(row[colPrecio])
                            });
                        }
                        setRawData(parsed); setLoading(false);
                    } catch (err) { 
                        setErrorMsg("Error al conectar"); 
                        setLoading(false); 
                        setIsConnected(false); // Marcar como desconectado
                    }
                };
                loadData();
                if (window.jspdf) { setIsPdfReady(true); } 
                else { const checkPdf = setInterval(() => { if (window.jspdf) { setIsPdfReady(true); clearInterval(checkPdf); } }, 500); }
            }, []);

            // --- LÓGICA DE DATOS ---
            const filteredData = useMemo(() => {
                if (selectedYear === 'All' || selectedYear === 'Forecast') return rawData;
                return rawData.filter(d => d.Year === parseInt(selectedYear));
            }, [rawData, selectedYear]);

            const chartData = useMemo(() => {
                const months = Array.from({length:12},(_,i)=>({name:new Date(2024,i,1).toLocaleString('es-MX',{month:'short'}).toUpperCase(), monthIdx:i+1, y2024:0, y2025:0, y2026_forecast:0}));
                rawData.forEach(d => { 
                    if(months[d.Month-1]) { 
                        if(d.Year===2024) months[d.Month-1].y2024+=d.Total_compra; 
                        if(d.Year===2025) months[d.Month-1].y2025+=d.Total_compra; 
                    }
                });
                const series = [];
                const monthsFull = Array.from({length:12},(_,i)=>({y24:0, y25:0}));
                rawData.forEach(d => { if(d.Year===2024) monthsFull[d.Month-1].y24+=d.Total_compra; if(d.Year===2025) monthsFull[d.Month-1].y25+=d.Total_compra; });
                [2024, 2025].forEach((y, idx) => monthsFull.forEach(m => series.push(idx===0?m.y24:m.y25)));
                
                // --- FORECAST INTEGRATION: Usar Motor Operativo ---
                if (series.length > 0) {
                    const operationalForecast = generateOperationalForecast(series, 12);
                    months.forEach((m,i) => m.y2026_forecast = operationalForecast[i] || 0);
                }
                return months;
            }, [rawData]);

            const kpiMetrics = useMemo(() => {
                if (!filteredData || (!filteredData.length && selectedYear !== 'Forecast')) return null;

                const kilos25 = rawData.filter(d => d.Year === 2025).reduce((a,b)=>a+b.Kilos,0);
                const kilos24 = rawData.filter(d => d.Year === 2024).reduce((a,b)=>a+b.Kilos,0);

                if (selectedYear === 'Forecast') {
                    if (!chartData || chartData.length === 0) return null;
                    const totalRevenueForecast = chartData.reduce((acc, curr) => acc + curr.y2026_forecast, 0);
                    const rev25 = rawData.filter(d => d.Year === 2025).reduce((a,b)=>a+b.Total_compra,0);
                    
                    const impliedGrowth = rev25 > 0 ? (totalRevenueForecast - rev25) / rev25 : 0;
                    const totalKilosForecast = kilos25 * (1 + impliedGrowth);
                    const avgPriceForecast = totalKilosForecast > 0 ? totalRevenueForecast / totalKilosForecast : 0;
                    
                    const volumeDiff = totalKilosForecast - kilos25;
                    const volumeTrendStr = `${volumeDiff > 0 ? '+' : ''}${formatNumber(volumeDiff)}kg`;

                    return { 
                        revenue: totalRevenueForecast, 
                        kilos: totalKilosForecast, 
                        clients: new Set(rawData.map(d=>d.Sucursal)).size, 
                        avgPrice: avgPriceForecast, 
                        growth: `${impliedGrowth > 0 ? '+' : ''}${(impliedGrowth * 100).toFixed(1)}%`, 
                        trend: 'up',
                        volumeTrend: volumeTrendStr,
                        volumeTrendDir: volumeDiff >= 0 ? 'up' : 'down'
                    };
                }

                const revenue = filteredData.reduce((a,b)=>a+b.Total_compra,0);
                const kilos = filteredData.reduce((a,b)=>a+b.Kilos,0);
                const wSum = filteredData.reduce((a,b)=>a+(b.Kilos * b.Precio_por_Kg),0);
                const avgPrice = kilos > 0 ? wSum / kilos : 0;
                
                let growth = 0;
                let volumeDiff = 0;
                let volumeTrendStr = "--";
                let volumeTrendDir = "neutral";

                if (selectedYear === '2025') {
                    const rev25 = rawData.filter(d => d.Year === 2025).reduce((a,b)=>a+b.Total_compra,0);
                    const rev24 = rawData.filter(d => d.Year === 2024).reduce((a,b)=>a+b.Total_compra,0);
                    if (rev24 > 0) growth = ((rev25 - rev24) / rev24) * 100;
                    
                    volumeDiff = kilos25 - kilos24;
                    volumeTrendStr = `${volumeDiff > 0 ? '+' : ''}${formatNumber(volumeDiff)}kg`;
                    volumeTrendDir = volumeDiff >= 0 ? 'up' : 'down';
                }

                return { 
                    revenue, 
                    kilos, 
                    clients: new Set(filteredData.map(d=>d.Sucursal)).size, 
                    avgPrice, 
                    growth: `${growth > 0 ? '+' : ''}${Math.abs(growth).toFixed(1)}%`, 
                    trend: growth>0?'up':'down',
                    volumeTrend: volumeTrendStr,
                    volumeTrendDir: volumeTrendDir
                };
            }, [filteredData, rawData, selectedYear, chartData]);

            // --- Custom Tooltip Ajustado ---
            const CustomTooltip = ({ active, payload, label }) => {
                if (active && payload && payload.length) {
                    const p24 = payload.find(p => p.dataKey === 'y2024');
                    const p25 = payload.find(p => p.dataKey === 'y2025');
                    const p26 = payload.find(p => p.dataKey === 'y2026_forecast');
                    const v24 = p24 ? p24.value : 0;
                    const v25 = p25 ? p25.value : 0;
                    const v26 = p26 ? p26.value : 0;
                    const growth = v24 > 0 ? ((v25 - v24) / v24) * 100 : 0;
                    const growthStr = v24 > 0 ? `${growth > 0 ? '+' : ''}${growth.toFixed(2)}%` : '-';
                    const growthColor = growth >= 0 ? 'text-emerald-500' : 'text-rose-500';

                    return (
                        <div className="bg-white p-3 border border-slate-200 shadow-lg rounded-lg text-xs">
                            <p className="font-bold text-slate-700 mb-2 border-b pb-1">{label}</p>
                            <div className="flex justify-between gap-4 mb-1"><span className="text-[#1e3a8a] font-medium">2024:</span><span className="font-medium text-slate-700">{formatCurrency(v24)}</span></div>
                            <div className="flex justify-between gap-4 mb-1"><span className="text-[#FF8A00] font-medium">2025:</span><div className="text-right"><span className="font-bold text-[#FF8A00] block">{formatCurrency(v25)}</span><span className={`text-[10px] ${growthColor} block`}>{growthStr}</span></div></div>
                             <div className="flex justify-between gap-4 pt-1 border-t border-slate-100 mt-1"><span className="text-rose-500 font-medium">Forecast 2026:</span><span className="font-bold text-rose-500">{formatCurrency(v26)}</span></div>
                        </div>
                    );
                }
                return null;
            };

            const generateInsights = (groupByKey) => {
                const entities = {};
                rawData.forEach(d => {
                    const key = d[groupByKey];
                    if (!entities[key]) entities[key] = { name: key, revenue2024: 0, revenue2025: 0, products2024: new Set(), products2025: new Set() };
                    const e = entities[key];
                    if (d.Year === 2024) { e.revenue2024 += d.Total_compra; e.products2024.add(d.Variedad); } 
                    else if (d.Year === 2025) { e.revenue2025 += d.Total_compra; e.products2025.add(d.Variedad); }
                });
                return Object.values(entities).map(e => {
                    const growth = e.revenue2024 > 0 ? ((e.revenue2025 - e.revenue2024) / e.revenue2024) * 100 : 0;
                    let cityKey = null;
                    if (groupByKey === 'Sucursal') {
                        const s = e.name;
                        if (BRANCH_MAPPING[s]) cityKey = BRANCH_MAPPING[s]; 
                        else {
                            if (s.includes('Cancún')||s.includes('Cancun')) cityKey='CANCUN';
                            else if (s.includes('Monterrey')) cityKey='MONTERREY';
                            else if (s.includes('Guadalajara')) cityKey='GUADALAJARA';
                            else if (s.includes('Mérida')) cityKey='MERIDA';
                            else if (s.includes('Bajio')) cityKey='GUANAJUATO';
                            else if (s.includes('Vallarta')) cityKey='VALLARTA';
                            else if (s.includes('Querétaro')) cityKey='QUERETARO';
                            else if (s.includes('Metepec')) cityKey='METEPEC';
                        }
                    }
                    // --- FORECAST INTEGRATION: Usar Structural Growth para tablas anuales ---
                    const forecast2026 = calculateStructuralForecast2026(e.revenue2024, e.revenue2025);
                    const forecastVar = forecast2026 - e.revenue2025;
                    return { ...e, city: cityKey ? CITY_COORDINATES[cityKey].label : '', growth, lostProducts: [...e.products2024].filter(x => !e.products2025.has(x)), newProducts: [...e.products2025].filter(x => !e.products2024.has(x)), forecast2026, forecastVar };
                }).sort((a,b) => b.revenue2025 - a.revenue2025);
            };

            const branchInsightsData = useMemo(() => generateInsights('Sucursal'), [rawData]);
            const socialReasonInsightsData = useMemo(() => generateInsights('RazonSocial'), [rawData]);
            
            const consumptionData = useMemo(() => {
                const grouped = {};
                filteredData.forEach(item => {
                    const key = item.TipoConsumo;
                    if (!grouped[key]) grouped[key] = { name: key, value: 0 };
                    grouped[key].value += item.Kilos;
                });
                return Object.values(grouped).sort((a, b) => b.value - a.value);
            }, [filteredData]);

            const consumptionForecast = useMemo(() => {
                let monthsInQ = [];
                if (selectedForecastQuarter === 'Q1') monthsInQ = [1, 2, 3];
                else if (selectedForecastQuarter === 'Q2') monthsInQ = [4, 5, 6];
                else if (selectedForecastQuarter === 'Q3') monthsInQ = [7, 8, 9];
                else monthsInQ = [10, 11, 12];
                const baseData = rawData.filter(d => (d.Year === 2025 || d.Year === 2024) && monthsInQ.includes(d.Month));
                const grouped = {};
                baseData.forEach(item => {
                    if (!grouped[item.TipoConsumo]) grouped[item.TipoConsumo] = 0;
                    grouped[item.TipoConsumo] += item.Kilos; 
                });
                Object.keys(grouped).forEach(k => grouped[k] = grouped[k] / (baseData.some(d=>d.Year===2024) && baseData.some(d=>d.Year===2025) ? 2 : 1));
                const t24 = rawData.filter(d => d.Year === 2024).reduce((a,b)=>a+b.Total_compra,0);
                const t25 = rawData.filter(d => d.Year === 2025).reduce((a,b)=>a+b.Total_compra,0);
                const growth = t24 ? (t25 - t24) / t24 : 0.1;
                const factor = 1 + (growth !== 0 ? growth : 0.05);
                return Object.keys(grouped).map(key => ({ name: key, current: grouped[key], forecast: grouped[key] * factor })).sort((a,b) => b.forecast - a.forecast);
            }, [rawData, selectedForecastQuarter]);

            const quarterlyData = useMemo(() => {
                const periods = {}; const types = new Set();
                filteredData.forEach(item => {
                    let q = item.Month <= 3 ? "Q1" : item.Month <= 6 ? "Q2" : item.Month <= 9 ? "Q3" : "Q4";
                    const key = selectedYear === 'All' ? `${q} '${item.Year.toString().slice(2)}` : q;
                    if (!periods[key]) periods[key] = { name: key };
                    types.add(item.TipoConsumo);
                    periods[key][item.TipoConsumo] = (periods[key][item.TipoConsumo] || 0) + item.Kilos;
                });
                return { data: Object.values(periods).sort((a,b) => a.name.localeCompare(b.name)), keys: Array.from(types) };
            }, [filteredData, selectedYear]);

            const periodAnalysisData = useMemo(() => {
                if (!periodStart || !periodEnd) return null;
                const sDate = new Date(periodStart); sDate.setHours(0,0,0,0);
                const eDate = new Date(periodEnd); eDate.setHours(23,59,59,999);
                const data = rawData.filter(d => d.Fecha >= sDate && d.Fecha <= eDate && (periodBranch === 'All' || d.Sucursal === periodBranch));
                if (data.length === 0) return { empty: true };
                const revenue = data.reduce((a,b)=>a+b.Total_compra,0);
                const kilos = data.reduce((a,b)=>a+b.Kilos,0);
                const prodCounts = {};
                data.forEach(d => { prodCounts[d.Variedad] = (prodCounts[d.Variedad] || 0) + d.Kilos; });
                const topProduct = Object.entries(prodCounts).sort((a,b)=>b[1]-a[1])[0];
                const narrative = `En el periodo seleccionado, ${periodBranch === 'All' ? 'todas las sucursales' : periodBranch} generaron ${formatCurrency(revenue)} con un volumen de ${formatNumber(kilos)} Kg. El producto más solicitado fue "${topProduct ? topProduct[0] : 'N/A'}" (${topProduct ? formatNumber(topProduct[1]) : 0} Kg).`;
                const breakdown = Object.entries(prodCounts).map(([name, kg]) => ({ name, kg, revenue: data.filter(d=>d.Variedad === name).reduce((a,b)=>a+b.Total_compra,0) })).sort((a,b) => b.kg - a.kg);
                return { revenue, kilos, narrative, breakdown, empty: false };
            }, [rawData, periodStart, periodEnd, periodBranch]);

            const downloadPDF = () => {
                if (!periodAnalysisData || periodAnalysisData.empty || !window.jspdf) return;
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();
                const annualData = rawData.filter(d => periodBranch === 'All' || d.Sucursal === periodBranch);
                const rev24 = annualData.filter(d => d.Year === 2024).reduce((a,b)=>a+b.Total_compra,0);
                const rev25 = annualData.filter(d => d.Year === 2025).reduce((a,b)=>a+b.Total_compra,0);
                const growth = rev24 > 0 ? ((rev25 - rev24) / rev24) : 0;
                const forecast = rev25 * (1 + (growth > 0 ? growth : 0.05));

                const primaryColor = [255, 138, 0]; 
                const secondaryColor = [30, 58, 138]; 

                doc.setFont("helvetica", "bold");
                doc.setFontSize(28);
                doc.setTextColor(...primaryColor);
                doc.text("SSC", 20, 25);
                doc.setFontSize(10);
                doc.setTextColor(100);
                doc.text("REPORTE EJECUTIVO DE RENDIMIENTO", 20, 32);
                doc.setDrawColor(230);
                doc.line(20, 38, 190, 38);

                doc.setFontSize(10);
                doc.setTextColor(50);
                doc.text(`Fecha de Emisión: ${new Date().toLocaleDateString()}`, 20, 50);
                doc.text(`Periodo Analizado: ${periodStart} al ${periodEnd}`, 20, 56);
                doc.text(`Alcance: ${periodBranch}`, 20, 62);

                doc.setFillColor(...secondaryColor);
                doc.rect(20, 70, 170, 30, 'F');
                doc.setTextColor(255);
                doc.setFontSize(12);
                doc.text("VENTAS PERIODO", 30, 82);
                doc.text("VOLUMEN", 120, 82);
                doc.setFontSize(16);
                doc.setFont("helvetica", "bold");
                doc.text(formatCurrency(periodAnalysisData.revenue), 30, 92);
                doc.text(`${formatNumber(periodAnalysisData.kilos)} Kg`, 120, 92);

                doc.setTextColor(50);
                doc.setFont("helvetica", "normal");
                doc.setFontSize(10);
                const splitText = doc.splitTextToSize(periodAnalysisData.narrative, 170);
                doc.text(splitText, 20, 115);

                doc.setFontSize(11);
                doc.setTextColor(...primaryColor);
                doc.text("CONTEXTO ANUAL & PROYECCIÓN", 20, 140);
                
                doc.autoTable({
                    startY: 145,
                    head: [['Concepto', 'Ventas 2024', 'Ventas 2025', 'Crecimiento', 'Forecast 2026']],
                    body: [['Total Anual', formatCurrency(rev24), formatCurrency(rev25), `${(growth*100).toFixed(1)}%`, formatCurrency(forecast)]],
                    theme: 'grid',
                    headStyles: { fillColor: secondaryColor },
                    styles: { fontSize: 9 }
                });

                doc.setFontSize(11);
                doc.setTextColor(...primaryColor);
                doc.text("DESGLOSE DE PRODUCTOS (PERIODO)", 20, doc.lastAutoTable.finalY + 15);

                const productRows = periodAnalysisData.breakdown.map(item => [item.name, `${formatNumber(item.kg)} Kg`, formatCurrency(item.revenue), `${((item.kg / periodAnalysisData.kilos) * 100).toFixed(1)}%`]);

                doc.autoTable({
                    startY: doc.lastAutoTable.finalY + 20,
                    head: [['Producto', 'Volumen', 'Venta Total', 'Participación']],
                    body: productRows,
                    theme: 'striped',
                    headStyles: { fillColor: primaryColor },
                    styles: { fontSize: 9 }
                });

                doc.save(`Reporte_SSC_${periodStart}.pdf`);
            };

            const downloadTablePDF = (data, title) => {
                if (!data || !window.jspdf) return;
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();
                
                // Ordenar alfabéticamente para el reporte
                const sortedData = [...data].sort((a, b) => a.name.localeCompare(b.name));

                doc.setFont("helvetica", "bold");
                doc.setFontSize(22);
                doc.setTextColor(255, 138, 0); // Orange
                doc.text("SSC", 14, 20);
                doc.setFontSize(14);
                doc.setTextColor(40);
                doc.text(title, 14, 30);
                
                const tableRows = sortedData.map(e => [
                    e.name,
                    formatCurrency(e.revenue2024),
                    formatCurrency(e.revenue2025),
                    `${e.growth > 0 ? '+' : ''}${e.growth.toFixed(1)}%`,
                    formatCurrency(e.forecast2026)
                ]);

                doc.autoTable({
                    startY: 35,
                    head: [['Entidad', '2024', '2025', 'Var %', 'Forecast 26']],
                    body: tableRows,
                    theme: 'striped',
                    headStyles: { fillColor: [30, 58, 138] }, // Navy
                    styles: { fontSize: 8 }
                });
                
                doc.save(`SSC_Reporte_${title.replace(/\s+/g, '_')}.pdf`);
            };

            const branchList = useMemo(() => [...new Set(rawData.map(d=>d.Sucursal))].sort(), [rawData]);

            const renderNavButton = (id, label, Icon) => (
                <button onClick={() => setActiveTab(id)} className={`flex flex-col items-center justify-center w-full py-3 ${activeTab === id ? 'text-[#FF8A00]' : 'text-gray-400 hover:text-gray-600'}`}>
                    <Icon size={24} className={activeTab === id ? 'fill-current opacity-20' : ''} strokeWidth={activeTab === id ? 2.5 : 2} />
                    <span className="text-[10px] font-medium mt-1 text-center leading-tight">{label}</span>
                </button>
            );

            return (
                <div className={`min-h-screen ${THEME.bg} ${THEME.text} font-sans relative pb-20 md:pb-0`}>
                    
                    {/* BARRA DE ERROR DE CONEXIÓN */}
                    {!isConnected && (
                        <div className="bg-red-600 text-white text-center py-2 text-sm font-bold animate-pulse px-4">
                            {t.connection_error}
                        </div>
                    )}

                    {selectedEntity && <DetailPanel entity={selectedEntity} onClose={() => setSelectedEntity(null)} type={activeTab === 'branches' ? 'Sucursal' : 'Razón Social'} t={t} />}

                    <div className="md:hidden fixed bottom-0 left-0 w-full bg-white border-t border-gray-200 z-50 flex justify-around shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
                        {renderNavButton('dashboard', t.dashboard, LayoutDashboard)}
                        {renderNavButton('branches', t.branches, Building2)}
                        {renderNavButton('social', t.social, Briefcase)}
                        {renderNavButton('products', t.products, Coffee)}
                        {renderNavButton('period', t.period, Search)}
                    </div>

                    <header className="hidden md:flex bg-white border-b border-gray-200 px-8 py-4 sticky top-0 z-40 items-center justify-between shadow-sm">
                        <div className="flex items-center gap-8">
                            <div className="flex items-center gap-2">
                                <img src="assets/images/logo.png" alt="SSC" className="h-10 w-auto" />
                            </div>
                            <nav className="flex gap-1">
                                {[{id:'dashboard',l:t.dashboard}, {id:'branches',l:t.branches}, {id:'social',l:t.social}, {id:'products',l:t.products}, {id:'period',l:t.period}].map(tab => (
                                    <button key={tab.id} onClick={() => setActiveTab(tab.id)} className={`px-4 py-2 rounded-full text-sm font-medium transition-all ${activeTab === tab.id ? 'bg-orange-50 text-[#FF8A00]' : 'text-gray-500 hover:text-gray-900 hover:bg-gray-50'}`}>{tab.l}</button>
                                ))}
                            </nav>
                        </div>
                        <div className="flex items-center gap-2">
                            <button onClick={()=>setLang('MX')} className={`text-xs font-bold px-3 py-1.5 rounded-full transition-colors ${lang==='MX'?'bg-gray-900 text-white':'bg-gray-100 text-gray-500 hover:bg-gray-200'}`}>MX</button>
                            <button onClick={()=>setLang('FR')} className={`text-xs font-bold px-3 py-1.5 rounded-full transition-colors ${lang==='FR'?'bg-gray-900 text-white':'bg-gray-100 text-gray-500 hover:bg-gray-200'}`}>FR</button>
                        </div>
                    </header>

                    <main className="p-4 md:p-8 max-w-7xl mx-auto">
                        {/* MOBILE HEADER CON LOGO Y SELECTOR DE IDIOMA */}
                        <div className="md:hidden flex justify-between items-center mb-6">
                            <img src="assets/images/logo.png" alt="SSC" className="h-8 w-auto" />
                            <div className="flex gap-2">
                                <button onClick={()=>setLang('MX')} className={`text-xs font-bold px-2 py-1 rounded ${lang==='MX'?'bg-gray-800 text-white':'bg-gray-200 text-gray-500'}`}>MX</button>
                                <button onClick={()=>setLang('FR')} className={`text-xs font-bold px-2 py-1 rounded ${lang==='FR'?'bg-gray-800 text-white':'bg-gray-200 text-gray-500'}`}>FR</button>
                            </div>
                        </div>

                        {activeTab !== 'branches' && activeTab !== 'social' && activeTab !== 'period' && activeTab !== 'methodology' && (
                            <div className="flex justify-end mb-6">
                                <div className="bg-white p-1 rounded-xl shadow-sm border border-gray-200 inline-flex">
                                    {['All', '2024', '2025', 'Forecast'].map(y => (
                                        <button key={y} onClick={() => setSelectedYear(y)} className={`px-4 py-1.5 rounded-lg text-sm font-medium transition-all ${selectedYear === y ? 'bg-gray-900 text-white shadow' : 'text-gray-500 hover:text-gray-900'}`}>{y === 'All' ? t.historical : y === 'Forecast' ? t.forecast : y}</button>
                                    ))}
                                </div>
                            </div>
                        )}

                        {loading && <div className="text-[#FF8A00] animate-pulse text-center py-20 text-lg font-medium">{t.loading}</div>}

            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
