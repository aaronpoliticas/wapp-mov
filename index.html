<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SSC Analytics Dashboard</title>
    
    <!-- FUENTES -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Antonio:wght@700&display=swap" rel="stylesheet">

    <!-- TAILWIND CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Antonio', 'sans-serif'],
                    },
                    colors: {
                        ssc: {
                            primary: '#FF8A00',
                            secondary: '#1e3a8a',
                        }
                    }
                }
            }
        }
    </script>

    <!-- BABEL -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- LIBRERÍAS EXTERNAS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <!-- IMPORT MAP -->
    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.2.0",
            "react-dom": "https://esm.sh/react-dom@18.2.0",
            "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
            "recharts": "https://esm.sh/recharts@2.12.0?external=react,react-dom",
            "lucide-react": "https://esm.sh/lucide-react@0.330.0?external=react"
        }
    }
    </script>

    <style>
        body { background-color: #F5F6F7; -webkit-font-smoothing: antialiased; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #CBD5E1; border-radius: 20px; }
        .animate-in { animation: fadeIn 0.5s ease-out forwards; opacity: 0; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useMemo, useEffect, useCallback } from 'react';
        import { createRoot } from 'react-dom/client';
        import { 
            LineChart, Line, BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, Legend, ResponsiveContainer, 
            AreaChart, Area, PieChart, Pie, Cell 
        } from 'recharts';
        import { 
            LayoutDashboard, MapPin, Coffee, ArrowUpRight, ArrowDownRight, DollarSign, Weight, 
            Activity, Calendar, FileText, AlertCircle, Zap, Filter, Layers, Info, Map as MapIcon, 
            ChevronDown, RefreshCw, TrendingUp, TrendingDown, AlertTriangle, Building2, Briefcase, 
            Search, Download, Menu, X, FileSpreadsheet, Upload
        } from 'lucide-react';

        // --- SISTEMA DE DISEÑO ---
        const THEME = {
            bg: 'bg-[#F5F6F7]',       
            card: 'bg-[#FFFFFF]',     
            border: 'border-[#E6E8EB]',
            text: 'text-[#1F2933]',   
            subtext: 'text-[#6B7280]', 
            accent: 'text-[#FF8A00]', 
            gradient: 'from-[#FF8A00] to-[#FF5E00]',
            colors: {
                primary: '#FF8A00',     
                secondary: '#1e3a8a',   
                tertiary: '#F59E0B',    
                quaternary: '#FDBA74',  
                slate: '#9CA3AF',
                forecast: '#EF4444',    
                stacks: ['#FF8A00', '#1e3a8a', '#F59E0B', '#EF4444', '#8B5CF6', '#10B981'] 
            }
        };

        const CITY_COORDINATES = {
            'MONTERREY': { top: 25, left: 48, label: 'Monterrey' },
            'GUADALAJARA': { top: 55, left: 38, label: 'Guadalajara' },
            'VALLARTA': { top: 58, left: 34, label: 'Vallarta' },
            'GUANAJUATO': { top: 50, left: 42, label: 'Bajío' },
            'QUERETARO': { top: 53, left: 44, label: 'Querétaro' },
            'CDMX': { top: 60, left: 48, label: 'CDMX' },
            'METEPEC': { top: 62, left: 47, label: 'Toluca' },
            'MERIDA': { top: 40, left: 82, label: 'Mérida' },
            'CANCUN': { top: 42, left: 88, label: 'Cancún' },
        };

        const BRANCH_MAPPING = {
            'Mayson Kayser - Polanquito': 'CDMX',
            'Mera - Aeropuerto Guanajuato (Bajio)': 'GUANAJUATO',
            'Mera - Aeropuerto Cancún T2': 'CANCUN',
            'Mayson Kayser - Virreyes': 'CDMX',
            'Mayson Kayser - Mifel (Mazaryk)': 'CDMX',
            'Mera - Mérida': 'MERIDA',
            'Mayson Kayser - Metepec': 'METEPEC',
            'Mera - Aeropuerto Guadalajara': 'GUADALAJARA',
            'Mera - Cancún T4': 'CANCUN',
            'Mera - Aeropuerto Monterrey': 'MONTERREY',
            'Carmela & Sal': 'CDMX',
            'Mayson Kayser - Hospital Angeles Querétaro': 'QUERETARO',
            'Mera - Aeropuerto Vallarta': 'VALLARTA',
            'Mayson Kayser - Homero': 'CDMX', 
            'Mayson Kayser - Arcos Bosques': 'CDMX'
        };

        // --- ALGORITMOS ---
        const calculateHoltWinters = (data, seasonLength = 12, alpha = 0.2, beta = 0.1, gamma = 0.1, forecastLength = 12) => {
            if (!data || data.length === 0) return Array(forecastLength).fill(0);
            if (data.length < seasonLength * 2) {
                const growth = data.length > 12 ? (data[data.length-1] - data[0]) / data.length : 0.05;
                const lastVal = data[data.length - 1] || 0;
                return Array.from({length: forecastLength}, (_, i) => lastVal * (1 + growth * (i+1)));
            }
            let seasonals = {};
            let seasonalAvg = Array.from({length: seasonLength}, () => 0);
            const dataAvg = data.reduce((a,b)=>a+b,0)/data.length;
            for (let i = 0; i < seasonLength; i++) {
                seasonalAvg[i] = (data[i] + data[i + seasonLength]) / 2;
                seasonals[i] = seasonalAvg[i] - dataAvg;
            }
            let level = data[seasonLength-1]; 
            let trend = (data[seasonLength-1] - data[0]) / seasonLength; 
            
            for (let i = seasonLength; i < data.length; i++) {
                const val = data[i];
                const lastLevel = level;
                const seasonIdx = i % seasonLength;
                level = alpha * (val - seasonals[seasonIdx]) + (1 - alpha) * (lastLevel + trend);
                trend = beta * (level - lastLevel) + (1 - beta) * trend;
                seasonals[seasonIdx] = gamma * (val - level) + (1 - gamma) * seasonals[seasonIdx];
            }
            const forecast = [];
            for (let i = 1; i <= forecastLength; i++) {
                const seasonIdx = (data.length + i - 1) % seasonLength;
                const val = level + (trend * i) + seasonals[seasonIdx];
                forecast.push(val > 0 ? val : 0);
            }
            return forecast;
        };

        // --- HELPERS SEGUROS ---
        const formatCurrency = (val) => {
            if (val === undefined || val === null || isNaN(val)) return '$0';
            return new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN', maximumFractionDigits: 0 }).format(val);
        };
        const formatNumber = (val) => {
            if (val === undefined || val === null || isNaN(val)) return '0';
            return new Intl.NumberFormat('es-MX').format(val);
        };

        // --- COMPONENTES UI ---
        const KPICard = ({ title, value, subValue, icon: Icon, trend, trendValue, isForecast }) => (
            <div className={`${THEME.card} border ${isForecast ? 'border-red-200 bg-red-50/30' : THEME.border} rounded-xl p-5 shadow-sm hover:shadow-md transition-all h-full relative overflow-hidden group`}>
                <div className={`absolute top-0 right-0 p-4 opacity-5 group-hover:opacity-10 transition-opacity text-slate-800`}>
                    <Icon size={80} />
                </div>
                <div className="flex items-center justify-between mb-3">
                    <div className={`p-2.5 rounded-lg ${isForecast ? 'bg-red-100 text-red-500' : 'bg-orange-50 text-orange-500'}`}>
                        <Icon size={20} />
                    </div>
                    {trend !== null && !isNaN(trendValue) && (
                        <div className={`flex items-center gap-1 text-xs font-bold px-2 py-1 rounded-full ${trend === 'up' ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700'}`}>
                            {trend === 'up' ? <ArrowUpRight size={14} /> : <ArrowDownRight size={14} />}
                            {trendValue}%
                        </div>
                    )}
                </div>
                <h3 className={`${THEME.subtext} text-xs font-bold uppercase tracking-widest ${isForecast ? 'text-red-400' : ''}`}>{title}</h3>
                <div className="mt-1">
                    <div className={`text-2xl font-extrabold ${isForecast ? 'text-red-600' : THEME.text} tracking-tight`}>{value}</div>
                    <div className={`${THEME.subtext} text-xs mt-0.5`}>{subValue}</div>
                </div>
            </div>
        );

        const DetailPanel = ({ entity, onClose, type = "Sucursal" }) => {
            if (!entity) return null;
            const insights = [];
            if (entity.growth > 20) insights.push({ type: 'good', text: 'Crecimiento Exponencial (>20%)', icon: Zap });
            if (entity.growth < -10) insights.push({ type: 'bad', text: 'Alerta de Decremento', icon: TrendingDown });
            if (entity.lostProducts.length > 0) insights.push({ type: 'warn', text: `Dejó de comprar: ${entity.lostProducts.join(', ')}`, icon: AlertTriangle });
            if (entity.newProducts.length > 0) insights.push({ type: 'good', text: `Nuevos productos: ${entity.newProducts.join(', ')}`, icon: Layers });

            return (
                <div className="fixed inset-y-0 right-0 w-full md:w-96 bg-white border-l border-gray-200 shadow-2xl p-6 z-[100] overflow-y-auto animate-in slide-in-from-right">
                    <div className="flex justify-between items-start mb-6">
                        <div>
                            <h2 className="text-xl font-bold text-gray-900 leading-tight">{entity.name}</h2>
                            <p className="text-gray-500 text-sm mt-1">{type}: {entity.city || 'Ubicación General'}</p>
                        </div>
                        <button onClick={onClose} className="p-2 hover:bg-gray-100 rounded-lg text-gray-400 hover:text-gray-900">
                            <X size={20} />
                        </button>
                    </div>
                    <div className="grid grid-cols-2 gap-4 mb-6">
                        <div className="bg-gray-50 p-4 rounded-xl border border-gray-100">
                            <p className="text-xs text-gray-500">Venta 2024</p>
                            <p className="text-lg font-bold text-[#1e3a8a] mt-1">${new Intl.NumberFormat('es-MX', {maximumFractionDigits:0}).format(entity.revenue2024)}</p>
                        </div>
                        <div className="bg-gray-50 p-4 rounded-xl border border-gray-100">
                            <p className="text-xs text-gray-500">Venta 2025</p>
                            <p className="text-lg font-bold text-[#FF8A00] mt-1">${new Intl.NumberFormat('es-MX', {maximumFractionDigits:0}).format(entity.revenue2025)}</p>
                        </div>
                        <div className="bg-gray-50 p-4 rounded-xl border border-gray-100 col-span-2 flex justify-between items-center">
                            <div>
                                <p className="text-xs text-gray-500">Diferencia '24 vs '25</p>
                                <p className={`text-xl font-bold mt-1 ${entity.growth >= 0 ? 'text-emerald-600' : 'text-rose-600'}`}>
                                    {entity.growth > 0 ? '+' : ''}{entity.growth.toFixed(1)}%
                                </p>
                            </div>
                            <div className={`p-2 rounded-lg ${entity.growth >= 0 ? 'bg-emerald-100' : 'bg-rose-100'}`}>
                                {entity.growth >= 0 ? <ArrowUpRight className="text-emerald-600" /> : <ArrowDownRight className="text-rose-600" />}
                            </div>
                        </div>
                    </div>
                    <div className={`bg-gradient-to-r ${THEME.gradient} rounded-xl p-5 mb-6 relative overflow-hidden shadow-lg`}>
                        <div className="relative z-10">
                            <h3 className="text-white/90 font-bold text-sm mb-1 flex items-center gap-2"><Zap size={14}/> Forecast 2026 (Est.)</h3>
                            <p className="text-2xl font-bold text-white">${new Intl.NumberFormat('es-MX', {maximumFractionDigits:0}).format(entity.revenue2025 * (1 + (entity.growth/100)))}</p>
                            <p className="text-xs text-white/80 mt-1">Basado en tendencia histórica</p>
                        </div>
                        <div className="absolute right-0 top-0 p-4 opacity-20 text-white"><TrendingUp size={80} /></div>
                    </div>
                    <h3 className="font-bold text-gray-900 mb-3">Notas de Análisis</h3>
                    <div className="space-y-3">
                        {insights.length > 0 ? insights.map((insight, i) => {
                            const InsightIcon = insight.icon;
                            return (
                                <div key={i} className={`p-3 rounded-lg border flex items-start gap-3 text-sm ${
                                    insight.type === 'good' ? 'bg-emerald-50 border-emerald-200 text-emerald-700' :
                                    insight.type === 'bad' ? 'bg-rose-50 border-rose-200 text-rose-700' :
                                    'bg-amber-50 border-amber-200 text-amber-700'
                                }`}>
                                    <InsightIcon size={16} className="shrink-0 mt-0.5" />
                                    <span>{insight.text}</span>
                                </div>
                            );
                        }) : <p className="text-gray-400 text-sm italic">Sin anomalías detectadas.</p>}
                    </div>
                </div>
            );
        };

        const App = () => {
            const [activeTab, setActiveTab] = useState('dashboard');
            const [rawData, setRawData] = useState([]);
            const [selectedYear, setSelectedYear] = useState('All'); 
            const [loading, setLoading] = useState(false); 
            const [errorMsg, setErrorMsg] = useState(null);
            const [isXlsxReady, setIsXlsxReady] = useState(false);
            const [isPdfReady, setIsPdfReady] = useState(false);
            const [selectedForecastQuarter, setSelectedForecastQuarter] = useState('Q1');
            const [selectedEntity, setSelectedEntity] = useState(null); 
            const [periodStart, setPeriodStart] = useState('');
            const [periodEnd, setPeriodEnd] = useState('');
            const [periodBranch, setPeriodBranch] = useState('All');
            const [isDragging, setIsDragging] = useState(false);

            useEffect(() => {
                if (window.XLSX) { setIsXlsxReady(true); } else {
                    const interval = setInterval(() => {
                         if (window.XLSX) { setIsXlsxReady(true); clearInterval(interval); }
                    }, 500);
                }

                if (window.jspdf) { setIsPdfReady(true); } 
                else { 
                   const checkPdf = setInterval(() => { if (window.jspdf) { setIsPdfReady(true); clearInterval(checkPdf); } }, 500);
                }
            }, []);

            // --- PROCESAMIENTO EXCEL ---
            const processFile = useCallback((file) => {
                if (!file) return;
                setLoading(true); setErrorMsg(null);
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const data = e.target.result;
                        const workbook = window.XLSX.read(data, { type: 'array', cellDates: true });
                        const worksheet = workbook.Sheets[workbook.SheetNames[0]];
                        const jsonData = window.XLSX.utils.sheet_to_json(worksheet, { defval: "" });
                        if (!jsonData.length) throw new Error("Archivo vacío.");
                        
                        const keys = Object.keys(jsonData[0]);
                        const findKey = (terms) => keys.find(k => terms.some(t => k.toLowerCase().includes(t)));
                        const colFecha = findKey(['fecha', 'date']);
                        const colTotal = findKey(['total compra', 'total']);
                        const colKilos = keys.find(k => ['kilos', 'kg', 'peso'].includes(k.toLowerCase().trim())) || findKey(['kilos', 'kg']);
                        const colPrecio = findKey(['precio por kg', 'precio', 'precio_kg']);
                        const colSucursal = findKey(['sucursal', 'tienda']);
                        const colRazon = findKey(['razon social', 'razón social', 'cliente', 'empresa']); 
                        const colVariedad = findKey(['variedad', 'producto']);
                        const colTipo = findKey(['tipo de consumo', 'consumo', 'tipo']);

                        if (!colFecha || !colTotal) throw new Error("Faltan columnas clave (Fecha o Total).");

                        const parsed = jsonData.map((row, i) => {
                            let d = row[colFecha];
                            if (!(d instanceof Date)) d = new Date(d);
                            if (isNaN(d.getTime())) return null;
                            let tipo = String(row[colTipo] || 'General').trim();
                            if(tipo.length > 1) tipo = tipo.charAt(0).toUpperCase() + tipo.slice(1).toLowerCase();
                            return {
                                id: i, Fecha: d, Year: d.getFullYear(), Month: d.getMonth() + 1, Day: d.getDate(),
                                Sucursal: String(row[colSucursal] || 'Desconocida').trim(),
                                RazonSocial: String(row[colRazon] || 'General').trim(), 
                                Variedad: String(row[colVariedad] || 'General').trim(),
                                TipoConsumo: tipo,
                                Kilos: parseFloat(row[colKilos]) || 0,
                                Total_compra: parseFloat(row[colTotal]) || 0,
                                Precio_por_Kg: parseFloat(row[colPrecio]) || 0,
                            };
                        }).filter(Boolean);
                        setRawData(parsed); setLoading(false);
                    } catch (err) { console.error(err); setErrorMsg(err.message); setLoading(false); }
                };
                reader.readAsArrayBuffer(file);
            }, []);

            const onDrop = (e) => { e.preventDefault(); setIsDragging(false); if(e.dataTransfer.files[0]) processFile(e.dataTransfer.files[0]); };

            // --- LÓGICA DE DATOS ---
            const filteredData = useMemo(() => {
                if (selectedYear === 'All' || selectedYear === 'Forecast') return rawData;
                return rawData.filter(d => d.Year === parseInt(selectedYear));
            }, [rawData, selectedYear]);

            // --- CHART DATA (Calculado ANTES que kpiMetrics) ---
            const chartData = useMemo(() => {
                const months = Array.from({length:12},(_,i)=>({name:new Date(2024,i,1).toLocaleString('es-MX',{month:'short'}).toUpperCase(), monthIdx:i+1, y2024:0, y2025:0, y2026_forecast:0}));
                
                // Procesamiento base
                rawData.forEach(d => { 
                    if(months[d.Month-1]) { 
                        if(d.Year===2024) months[d.Month-1].y2024+=d.Total_compra; 
                        if(d.Year===2025) months[d.Month-1].y2025+=d.Total_compra; 
                    }
                });

                // Calcular Forecast (Holt-Winters) siempre
                const series = [];
                const monthsFull = Array.from({length:12},(_,i)=>({y24:0, y25:0}));
                rawData.forEach(d => { if(d.Year===2024) monthsFull[d.Month-1].y24+=d.Total_compra; if(d.Year===2025) monthsFull[d.Month-1].y25+=d.Total_compra; });
                [2024, 2025].forEach((y, idx) => monthsFull.forEach(m => series.push(idx===0?m.y24:m.y25)));
                
                // Solo calcular si hay datos
                if (series.length > 0) {
                    const hw = calculateHoltWinters(series, 12, 0.3, 0.1, 0.3, 12);
                    months.forEach((m,i) => m.y2026_forecast = hw[i] || 0);
                }

                return months;
            }, [rawData]);

            const kpiMetrics = useMemo(() => {
                if (!filteredData || (!filteredData.length && selectedYear !== 'Forecast')) return null;

                // Caso especial FORECAST
                if (selectedYear === 'Forecast') {
                    if (!chartData || chartData.length === 0) return null;
                    const totalRevenueForecast = chartData.reduce((acc, curr) => acc + curr.y2026_forecast, 0);
                    
                    const rev25 = rawData.filter(d => d.Year === 2025).reduce((a,b)=>a+b.Total_compra,0);
                    const kilos25 = rawData.filter(d => d.Year === 2025).reduce((a,b)=>a+b.Kilos,0);
                    
                    const impliedGrowth = rev25 > 0 ? (totalRevenueForecast - rev25) / rev25 : 0;
                    const totalKilosForecast = kilos25 * (1 + impliedGrowth);
                    const avgPriceForecast = totalKilosForecast > 0 ? totalRevenueForecast / totalKilosForecast : 0;

                    return {
                        revenue: totalRevenueForecast,
                        kilos: totalKilosForecast,
                        clients: new Set(rawData.map(d=>d.Sucursal)).size, 
                        avgPrice: avgPriceForecast,
                        growth: impliedGrowth * 100,
                        trend: 'up' 
                    };
                }

                const revenue = filteredData.reduce((a,b)=>a+b.Total_compra,0);
                const kilos = filteredData.reduce((a,b)=>a+b.Kilos,0);
                const wSum = filteredData.reduce((a,b)=>a+(b.Kilos * b.Precio_por_Kg),0);
                const avgPrice = kilos > 0 ? wSum / kilos : 0;
                let growth = 0;
                if (selectedYear === 'All' || selectedYear === '2025') {
                    const rev25 = rawData.filter(d => d.Year === 2025).reduce((a,b)=>a+b.Total_compra,0);
                    const rev24 = rawData.filter(d => d.Year === 2024).reduce((a,b)=>a+b.Total_compra,0);
                    if (rev24 > 0) growth = ((rev25 - rev24) / rev24) * 100;
                }
                return { revenue, kilos, clients: new Set(filteredData.map(d=>d.Sucursal)).size, avgPrice, growth: Math.abs(growth).toFixed(1), trend: growth>0?'up':'down' };
            }, [filteredData, rawData, selectedYear, chartData]);

            const generateInsights = (groupByKey) => {
                const entities = {};
                rawData.forEach(d => {
                    const key = d[groupByKey];
                    if (!entities[key]) entities[key] = { name: key, revenue2024: 0, revenue2025: 0, products2024: new Set(), products2025: new Set() };
                    const e = entities[key];
                    if (d.Year === 2024) { e.revenue2024 += d.Total_compra; e.products2024.add(d.Variedad); } 
                    else if (d.Year === 2025) { e.revenue2025 += d.Total_compra; e.products2025.add(d.Variedad); }
                });
                return Object.values(entities).map(e => {
                    const growth = e.revenue2024 > 0 ? ((e.revenue2025 - e.revenue2024) / e.revenue2024) * 100 : 0;
                    let cityKey = null;
                    if (groupByKey === 'Sucursal') {
                        const s = e.name;
                        if (BRANCH_MAPPING[s]) cityKey = BRANCH_MAPPING[s]; 
                        else {
                            if (s.includes('Cancún')||s.includes('Cancun')) cityKey='CANCUN';
                            else if (s.includes('Monterrey')) cityKey='MONTERREY';
                            else if (s.includes('Guadalajara')) cityKey='GUADALAJARA';
                            else if (s.includes('Mérida')) cityKey='MERIDA';
                            else if (s.includes('Bajio')) cityKey='GUANAJUATO';
                            else if (s.includes('Vallarta')) cityKey='VALLARTA';
                            else if (s.includes('Querétaro')) cityKey='QUERETARO';
                            else if (s.includes('Metepec')) cityKey='METEPEC';
                        }
                    }
                    return { ...e, city: cityKey ? CITY_COORDINATES[cityKey].label : '', growth, lostProducts: [...e.products2024].filter(x => !e.products2025.has(x)), newProducts: [...e.products2025].filter(x => !e.products2024.has(x)), forecast2026: e.revenue2025 * (1 + (growth > 0 ? growth/100 : 0.05)) };
                }).sort((a,b) => b.revenue2025 - a.revenue2025);
            };

            const branchInsightsData = useMemo(() => generateInsights('Sucursal'), [rawData]);
            const socialReasonInsightsData = useMemo(() => generateInsights('RazonSocial'), [rawData]);

            const consumptionData = useMemo(() => {
                const grouped = {};
                filteredData.forEach(item => {
                    const key = item.TipoConsumo;
                    if (!grouped[key]) grouped[key] = { name: key, value: 0 };
                    grouped[key].value += item.Kilos;
                });
                return Object.values(grouped).sort((a, b) => b.value - a.value);
            }, [filteredData]);

            const consumptionForecast = useMemo(() => {
                let monthsInQ = [];
                if (selectedForecastQuarter === 'Q1') monthsInQ = [1, 2, 3];
                else if (selectedForecastQuarter === 'Q2') monthsInQ = [4, 5, 6];
                else if (selectedForecastQuarter === 'Q3') monthsInQ = [7, 8, 9];
                else monthsInQ = [10, 11, 12];
                const baseData = rawData.filter(d => (d.Year === 2025 || d.Year === 2024) && monthsInQ.includes(d.Month));
                const grouped = {};
                baseData.forEach(item => {
                    if (!grouped[item.TipoConsumo]) grouped[item.TipoConsumo] = 0;
                    grouped[item.TipoConsumo] += item.Kilos; 
                });
                Object.keys(grouped).forEach(k => grouped[k] = grouped[k] / (baseData.some(d=>d.Year===2024) && baseData.some(d=>d.Year===2025) ? 2 : 1));
                const t24 = rawData.filter(d => d.Year === 2024).reduce((a,b)=>a+b.Total_compra,0);
                const t25 = rawData.filter(d => d.Year === 2025).reduce((a,b)=>a+b.Total_compra,0);
                const growth = t24 ? (t25 - t24) / t24 : 0.1;
                const factor = 1 + (growth !== 0 ? growth : 0.05);
                return Object.keys(grouped).map(key => ({ name: key, current: grouped[key], forecast: grouped[key] * factor })).sort((a,b) => b.forecast - a.forecast);
            }, [rawData, selectedForecastQuarter]);

            const quarterlyData = useMemo(() => {
                const periods = {}; const types = new Set();
                filteredData.forEach(item => {
                    let q = item.Month <= 3 ? "Q1" : item.Month <= 6 ? "Q2" : item.Month <= 9 ? "Q3" : "Q4";
                    const key = selectedYear === 'All' ? `${q} '${item.Year.toString().slice(2)}` : q;
                    if (!periods[key]) periods[key] = { name: key };
                    types.add(item.TipoConsumo);
                    periods[key][item.TipoConsumo] = (periods[key][item.TipoConsumo] || 0) + item.Kilos;
                });
                return { data: Object.values(periods).sort((a,b) => a.name.localeCompare(b.name)), keys: Array.from(types) };
            }, [filteredData, selectedYear]);

            const periodAnalysisData = useMemo(() => {
                if (!periodStart || !periodEnd) return null;
                const sDate = new Date(periodStart); sDate.setHours(0,0,0,0);
                const eDate = new Date(periodEnd); eDate.setHours(23,59,59,999);
                const data = rawData.filter(d => d.Fecha >= sDate && d.Fecha <= eDate && (periodBranch === 'All' || d.Sucursal === periodBranch));
                if (data.length === 0) return { empty: true };
                const revenue = data.reduce((a,b)=>a+b.Total_compra,0);
                const kilos = data.reduce((a,b)=>a+b.Kilos,0);
                const prodCounts = {};
                data.forEach(d => { prodCounts[d.Variedad] = (prodCounts[d.Variedad] || 0) + d.Kilos; });
                const topProduct = Object.entries(prodCounts).sort((a,b)=>b[1]-a[1])[0];
                const narrative = `En el periodo seleccionado, ${periodBranch === 'All' ? 'todas las sucursales' : periodBranch} generaron ${formatCurrency(revenue)} con un volumen de ${formatNumber(kilos)} Kg. El producto más solicitado fue "${topProduct ? topProduct[0] : 'N/A'}" (${topProduct ? formatNumber(topProduct[1]) : 0} Kg).`;
                const breakdown = Object.entries(prodCounts).map(([name, kg]) => ({ name, kg, revenue: data.filter(d=>d.Variedad === name).reduce((a,b)=>a+b.Total_compra,0) })).sort((a,b) => b.kg - a.kg);
                return { revenue, kilos, narrative, breakdown, empty: false };
            }, [rawData, periodStart, periodEnd, periodBranch]);

            const downloadPDF = () => {
                if (!periodAnalysisData || periodAnalysisData.empty || !window.jspdf) return;
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();
                const annualData = rawData.filter(d => periodBranch === 'All' || d.Sucursal === periodBranch);
                const rev24 = annualData.filter(d => d.Year === 2024).reduce((a,b)=>a+b.Total_compra,0);
                const rev25 = annualData.filter(d => d.Year === 2025).reduce((a,b)=>a+b.Total_compra,0);
                const growth = rev24 > 0 ? ((rev25 - rev24) / rev24) : 0;
                const forecast = rev25 * (1 + (growth > 0 ? growth : 0.05));

                const primaryColor = [255, 138, 0]; 
                const secondaryColor = [30, 58, 138]; 

                doc.setFont("helvetica", "bold");
                doc.setFontSize(28);
                doc.setTextColor(...primaryColor);
                doc.text("SSC", 20, 25);
                doc.setFontSize(10);
                doc.setTextColor(100);
                doc.text("REPORTE EJECUTIVO DE RENDIMIENTO", 20, 32);
                doc.setDrawColor(230);
                doc.line(20, 38, 190, 38);

                doc.setFontSize(10);
                doc.setTextColor(50);
                doc.text(`Fecha de Emisión: ${new Date().toLocaleDateString()}`, 20, 50);
                doc.text(`Periodo Analizado: ${periodStart} al ${periodEnd}`, 20, 56);
                doc.text(`Alcance: ${periodBranch}`, 20, 62);

                doc.setFillColor(...secondaryColor);
                doc.rect(20, 70, 170, 30, 'F');
                doc.setTextColor(255);
                doc.setFontSize(12);
                doc.text("VENTAS PERIODO", 30, 82);
                doc.text("VOLUMEN", 120, 82);
                doc.setFontSize(16);
                doc.setFont("helvetica", "bold");
                doc.text(formatCurrency(periodAnalysisData.revenue), 30, 92);
                doc.text(`${formatNumber(periodAnalysisData.kilos)} Kg`, 120, 92);

                doc.setTextColor(50);
                doc.setFont("helvetica", "normal");
                doc.setFontSize(10);
                const splitText = doc.splitTextToSize(periodAnalysisData.narrative, 170);
                doc.text(splitText, 20, 115);

                doc.setFontSize(11);
                doc.setTextColor(...primaryColor);
                doc.text("CONTEXTO ANUAL & PROYECCIÓN", 20, 140);
                
                doc.autoTable({
                    startY: 145,
                    head: [['Concepto', 'Ventas 2024', 'Ventas 2025', 'Crecimiento', 'Forecast 2026']],
                    body: [['Total Anual', formatCurrency(rev24), formatCurrency(rev25), `${(growth*100).toFixed(1)}%`, formatCurrency(forecast)]],
                    theme: 'grid',
                    headStyles: { fillColor: secondaryColor },
                    styles: { fontSize: 9 }
                });

                doc.setFontSize(11);
                doc.setTextColor(...primaryColor);
                doc.text("DESGLOSE DE PRODUCTOS (PERIODO)", 20, doc.lastAutoTable.finalY + 15);

                const productRows = periodAnalysisData.breakdown.map(item => [item.name, `${formatNumber(item.kg)} Kg`, formatCurrency(item.revenue), `${((item.kg / periodAnalysisData.kilos) * 100).toFixed(1)}%`]);

                doc.autoTable({
                    startY: doc.lastAutoTable.finalY + 20,
                    head: [['Producto', 'Volumen', 'Venta Total', 'Participación']],
                    body: productRows,
                    theme: 'striped',
                    headStyles: { fillColor: primaryColor },
                    styles: { fontSize: 9 }
                });

                doc.save(`Reporte_SSC_${periodStart}.pdf`);
            };

                                    {(selectedYear === 'All' || selectedYear === 'Forecast') && <div className="flex items-center gap-2 px-3 py-1 bg-red-50 text-red-500 rounded-full text-xs font-bold"><Zap size={12}/> Forecast AI</div>}
                                </div>
                                <div className="h-[300px]">
                                    <ResponsiveContainer width="100%" height="100%">
                                        <AreaChart data={chartData} margin={{top:5, right:0, left:-20, bottom:0}}>

                                            <Tooltip contentStyle={{backgroundColor:'#FFF', borderColor:'#E5E7EB', borderRadius:'12px', boxShadow:'0 10px 15px -3px rgba(0, 0, 0, 0.1)'}} formatter={v => formatCurrency(v)}/>
                                            
                                            {selectedYear !== 'Forecast' && (
                                                <>
                                                <Area type="monotone" dataKey="y2025" stroke={THEME.colors.primary} fill="url(#g25)" strokeWidth={3} name="2025" activeDot={{r:6, strokeWidth:0}} />
                                                <Area type="monotone" dataKey="y2024" stroke={THEME.colors.secondary} fill="transparent" strokeWidth={2} strokeDasharray="3 3" name="2024" />

                                            {(selectedYear === 'All' || selectedYear === 'Forecast') && (
                                                <Area 
                                                    type="monotone"

                                                    stroke={THEME.colors.forecast}

                            <KPICard title={selectedYear === 'Forecast' ? "Ventas Estimadas 2026" : "Ventas Totales"} value={formatCurrency(kpiMetrics.revenue)} subValue={selectedYear === 'Forecast' ? "Proyección Anual" : "Ingresos Brutos"} icon={DollarSign} trend={kpiMetrics.trend} trendValue={kpiMetrics.growth} isForecast={selectedYear === 'Forecast'} />

                        {!loading && !errorMsg && rawData.length > 0 && activeTab === 'products' && (

                                </div>
                                <div className="overflow-x-auto">
                                    <table className="w-full text-sm text-left">

                                        <tbody className="divide-y divide-gray-50">
                                            {consumptionData.map((item, i) => (
                                                <tr key={i} className="hover:bg-gray-50 transition-colors">

                            <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">

                                                <CartesianGrid strokeDasharray="3 3" stroke="#F3F4F6" vertical={false} />

                                                <Bar dataKey="name" fill={THEME.colors.primary} radius={[4, 4, 0, 0]} />

                                                    </td>
                                                    <td className="p-4 text-right font-bold text-indigo-600">{formatCurrency(entity.forecast2026)}</td>
                                                    <td className="p-4">
                                                        <div className="flex gap-2">
                                                            {entity.lostProducts.length > 0 && <AlertTriangle size={16} className="text-amber-500" />}
                                                            {entity.growth > 20 && <Zap size={16} className="text-blue-500" />}
                                                            {entity.growth === 0 && entity.revenue2025 === 0 && <span className="text-xs text-gray-400 italic">Inactivo</span>}
                                                        </div>
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                        )}

                        {!loading && !errorMsg && rawData.length > 0 && activeTab === 'period' && (
                            <div className="space-y-6 animate-in fade-in">
                                <div className="bg-white border border-gray-100 rounded-2xl p-6 shadow-sm">
                                    <div className="flex justify-between items-center mb-6">
                                        <h3 className="font-bold text-lg text-gray-900 flex items-center gap-2"><Search size={20} className="text-[#FF8A00]"/> Explorador de Fechas</h3>
                                        {periodAnalysisData && !periodAnalysisData.empty && (
                                            <button onClick={downloadPDF} className="flex items-center gap-2 px-4 py-2 bg-gray-900 hover:bg-black text-white rounded-lg font-bold text-xs transition-colors shadow-lg">
                                                <Download size={14} /> REPORTE PDF
                                            </button>
                                        )}
                                    </div>
                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                        <div className="space-y-1"><label className="text-xs font-bold text-gray-500 uppercase">Inicio</label><input type="date" className="w-full bg-gray-50 border border-gray-200 rounded-lg px-3 py-2 text-sm text-gray-900 focus:ring-2 focus:ring-orange-500 outline-none" onChange={(e) => setPeriodStart(e.target.value)} /></div>
                                        <div className="space-y-1"><label className="text-xs font-bold text-gray-500 uppercase">Fin</label><input type="date" className="w-full bg-gray-50 border border-gray-200 rounded-lg px-3 py-2 text-sm text-gray-900 focus:ring-2 focus:ring-orange-500 outline-none" onChange={(e) => setPeriodEnd(e.target.value)} /></div>
                                        <div className="space-y-1"><label className="text-xs font-bold text-gray-500 uppercase">Filtrar por</label><div className="relative"><select className="w-full bg-gray-50 border border-gray-200 rounded-lg px-3 py-2 text-sm text-gray-900 focus:ring-2 focus:ring-orange-500 outline-none appearance-none" onChange={(e) => setPeriodBranch(e.target.value)}><option value="All">Todas las Sucursales</option>{branchList.map((b, i) => <option key={i} value={b}>{b}</option>)}</select><ChevronDown size={14} className="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none" /></div></div>
                                    </div>
                                </div>

                                {periodAnalysisData && !periodAnalysisData.empty && (
                                    <div className="space-y-6">
                                        <div className="bg-indigo-50 border border-indigo-100 p-5 rounded-xl flex gap-4">
                                            <Info className="text-indigo-600 shrink-0 mt-0.5" size={20} />
                                            <div><h4 className="text-indigo-900 font-bold mb-1">Resumen Inteligente</h4><p className="text-indigo-700 text-sm leading-relaxed">{periodAnalysisData.narrative}</p></div>
                                        </div>
                                        <div className="grid grid-cols-2 gap-4">
                                            <div className="bg-white p-5 rounded-xl border border-gray-100 text-center shadow-sm"><p className="text-gray-400 text-xs font-bold uppercase mb-1">Ventas Totales</p><p className="text-3xl font-extrabold text-gray-900">{formatCurrency(periodAnalysisData.revenue)}</p></div>
                                            <div className="bg-white p-5 rounded-xl border border-gray-100 text-center shadow-sm"><p className="text-gray-400 text-xs font-bold uppercase mb-1">Volumen</p><p className="text-3xl font-extrabold text-[#FF8A00]">{formatNumber(periodAnalysisData.kilos)} <span className="text-lg text-gray-400">Kg</span></p></div>
                                        </div>
                                        <div className="bg-white border border-gray-100 rounded-xl overflow-hidden shadow-sm">
                                            <table className="w-full text-sm text-left">
                                                <thead className="text-gray-500 bg-gray-50 uppercase text-xs"><tr><th className="p-4 pl-6">Producto</th><th className="p-4 text-right">Kilos</th><th className="p-4 text-right pr-6">Venta</th></tr></thead>
                                                <tbody className="divide-y divide-gray-50">
                                                    {periodAnalysisData.breakdown.map((item, idx) => (
                                                        <tr key={idx} className="hover:bg-gray-50/50"><td className="p-4 pl-6 text-gray-900 font-medium">{item.name}</td><td className="p-4 text-right text-[#FF8A00] font-bold">{formatNumber(item.kg)}</td><td className="p-4 text-right pr-6 text-gray-600">{formatCurrency(item.revenue)}</td></tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}
                    </main>
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
